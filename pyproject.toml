[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wattbot"
version = "0.1.0"
description = "Citation-first RAG pipeline for the WattBot 2026 Kaggle competition"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
wattbot = "wattbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
